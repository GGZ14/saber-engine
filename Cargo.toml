[workspace]
resolver = "2"
members = [
  "crates/saber-abi",
  "crates/saber-hip",
  "crates/saber-hsa",
  "crates/saber-plan",
  "crates/saber-kernels",
  "crates/saber-mem",
  "crates/saber-exec",
  "crates/saber-model",
  "crates/saber-sched",
  "crates/saber-engine",
  "crates/saber-serve",
  "crates/saber-vision-input",
  "crates/saber-cli",
  "crates/saber-shadow",
  "crates/saber-test-scratch",
  "crates/saber-cpux",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
libloading = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
# P0.5 step loop: tokio feeds step requests over a BOUNDED channel; the step loop itself is a
# plain thread (ARCHITECTURE.md, "Rust-specific hazards": a work-stealing scheduler adds variance
# to exactly the path that wants fixed cadence).
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
