# FN84: the MoE miss-overlap order law (`--fn-moe-miss-order capped|cappre`, ARMS; the default is
# `id`): at decode / verify steps of <= t rows ONE RAM-tier workgroup of the fused back half takes a
# ticket per k resident ones (moe_back_mo{,p}_*'s kint). An ORDER, not a class: no byte depends on
# it. Measured (FN84 hold 1, card 1, IC-cold, 210 W, 0-25 % of the experts in pinned RAM): k 8 is
# the best capped k at every T (k 1 / 2 / 4 lose more) and still ties or loses to id order.
[[moe_miss]]
t = 64
k = 8
