## ---- workspaces ------------------------------------------------------------------------------
## NONE. Every buffer these producers touch is the layer's own tensor -- `hs`, `ro`, `a`, `asg`,
## `rs`, and the rotation table `t` / channel scales `cs` that belong to the consumer linear.
## Recorded as an empty section rather than omitted, because "this op needs no workspace" is a
## claim the descriptor makes and the gate checks.
