[decode_direct_control]
kernel = "mxfp4_gemm_decode_bk128_ks1_tm1_wperm1_nt1_indirect"
bk = 128
ks = 1
tm = 1
# The layout the ONE compiled instantiation requires. Named `*_required` rather than reusing the
# knob's spelling so that flipping the knob for a WPERM=0 run cannot silently flip this too --
# there is no wperm0 indirect kernel, and the control must say so.
wperm_required = true
nt_required = true

## ---- workspaces ----------------------------------------------------------------------------
## Retires `set_decode_scratch`. The partial buffer is aliasable between launches; the block
## counter is NOT -- it must be zeroed once and survive graph replay (the last block of a split
## resets it in place, so a replay that re-zeroed it would be correct only by luck, and one that
## reallocated it would corrupt a captured graph).
[workspace.decode_partial]
kind = "scratch"
# DEC_KS(4) x 64 rows x DEC_MAX_N(36864) x 4 B, the way ref_mxfp4.py sizes it from
# max(64, SABER_MXFP4_DECODE_MAX_M).
capacity_bytes = 37748736

[workspace.decode_counter]
kind = "persistent"
# one int per 128-wide n-block at DEC_MAX_N
capacity_bytes = 1152
