## ---- the skinny-N body (SABER-AUTHORED, workstream G6, 2026-09-24) -----------------------
## Bound only while `skinny` is on: N <= n_max (the 48-wide GDN gate at TP=2, 96 at TP=1), over the A
## layout the edge carries (`a_tiled`), never in place of a SPLIT decode cell. One wave per 16-row
## fragment and `tns` 16-column tiles walks all of K in the reference's order (`hip/mxfp4_skinny.h`):
## one summation class, 0 bytes (the k-reversal control fails on wide-N shapes; on the gate the
## no-fold control and the W-byte flip, the k-reversal being below the bf16 floor there, G5).
## Unit time at N = 48, K = 5120, IC-cold, us (what runs today -> the row's body):
##     p96 71.2 (decode ks1 tm6) -> 22.1 (r)     p128 86.0 (decode tm8) -> 22.5 (r)
##     p192 61.3 (G5 t3w4) -> 24.4 (r) / 22.6 (t)  p256 70.9 (folded) -> 26.0 (r) / 23.0 (t)
##     p320 66.8 (folded) -> 27.5 (r) / 23.3 (t)   p384 67.1 (G5 t3w4) -> 29.6 (r) / 23.6 (t)
##     p512 78.6 (folded) -> 30.9 (r) / 25.1 (t)   p768 53.0 (A-tiled tn2) -> 27.0 (t)
##     p1024 56.8 -> 29.4 (t)   p1536 66.2 -> 39.4 (t)   p2048 69-72 -> 49.5 (t); N = 96 alike.
## TNS = 3 (one wave, 48 columns) is 42 us: the chain is WMMA-latency-bound, so parallel waves win.
## The tiled row stops at 2048: no taller rung was timed.
[[skinny]]
m_min = 65
n_max = 96
a_tiled = false
tns = 1
wpb = 4
unr = 8

[[skinny]]
m_min = 129
m_max = 2048
n_max = 96
a_tiled = true
tns = 1
wpb = 4
unr = 8

## ---- the DIRECT=false decode control -------------------------------------------------------
## `mxfp4_gemm_decode_bk128_ks1_tm1_wperm1_nt1_indirect` is the ONE instantiation the reference
## keeps that the prod launcher cannot reach: at DKS==1 the DIRECT arm returns before it ever
## touches the partial slab, so the "writes C directly" fast path would otherwise be asserted
## rather than tested. This row is that test's target, and `resolve` refuses any shape that does
## not land on the exact cell it was compiled for -- it is a control, not a route.
# The fusion lever's second measurement: `silu_mul_quant` folded into the decode GEMM's A staging,
# so the GEMM reads the bf16 gate_up output directly and the producer's launch disappears.
#
# SELECTABLE ONLY ON AN EDGE WHOSE A PRODUCER IS silu_mul. That is not a shape property and cannot
# be derived from one: a decode GEMM at this shape normally takes a quantised A from whichever
# producer wrote it. `gemm_decode_fused_silu` is therefore a function the graph calls BY NAME when
# its edge says so, not an arm of `gemm` -- the same shape resolves to the plain kernel otherwise.
#
# Only the cells the decode band actually reaches for `down_proj` (N=5120, K=8704) at the M values
# a decode step produces. A shape the band would send to another cell has no fused symbol and is
# refused rather than served by a slower one.
[[decode_fused_silu]]
bk = 128
ks = 4
tm = 1
kernel = "mxfp4_gemm_decode_fused_silu_bk128_ks4_tm1_wperm1_nt1"

[[decode_fused_silu]]
bk = 128
ks = 4
tm = 2
kernel = "mxfp4_gemm_decode_fused_silu_bk128_ks4_tm2_wperm1_nt1"

[[decode_fused_silu]]
bk = 128
