# THE GROUPED MTP-EXPERT GEMM's K split. Per arm, the first row whose `max_tokens` holds T wins:
# the K splits of gate_up (`_g1`, [1280, 2560]) and down (`_g0`, [2560, 640]). The W8A8 fp8 arm
# (GATED) has no split parameter (one K walk). Every split is byte-oracled against the dense band
# at the same split (FN6); a split is an arithmetic CLASS, so a row splits only where it won in
# BOTH measurements. Card 1, 210 W, IC-cold, 7-rep medians, us gate_up ks1/ks2/ks4 | down ks1/ks2/ks4:
#   FN6 hold 4 (6 / 11 / 18 / 36 / 59 / 134 experts)   FN10 hold 1 (4 / 7 / 23 / 34 / 58 / 147)
#   T 1   119.5 / 105.0 / 139.1 |  61.6 / 60.1 / 58.6   81.7 / 78.3 / 96.5 |  42.4 / 46.6 / 46.9
#   T 2   204.3 / 209.4 / 231.0 | 100.8 /101.5 / 98.8  129.6 /129.7 /169.0 |  65.8 / 68.7 / 69.1
#   T 5   309.4 / 341.7 / 345.4 | 159.4 /154.5 /152.8  407.0 /397.7 /409.2 | 188.6 /192.4 /194.5
#   T 8   585.9 / 595.2 / 584.3 | 268.3 /291.8 /296.2  565.6 /575.6 /557.8 | 252.3 /281.8 /310.0
#   T 16  832.6 / 882.8 / 877.5 | 392.9 /464.2 /558.0  817.9 /869.9 /867.3 | 390.6 /455.3 /558.0
#   T 64 1618.8 /1870.6 /1872.9 | 804.7 /991.8/1304.5 1758.1/2032.2/2042.9 | 881.9/1078.2/1416.0
# gate_up ks2 wins T 1 in both (-12 percent, -4 percent); FN6's down ks4 (-2..-5 percent at T 1..5)
# reversed in FN10 hold 1 (ks1 3..10 percent faster): inside the noise, so down stays one split
# (one class) everywhere.
[[mtp_expert_split]]
arm = "bf16"
max_tokens = 1
gate_up = 2
down = 1

[[mtp_expert_split]]
arm = "bf16"
max_tokens = 4294967295
gate_up = 1
down = 1

[[mtp_expert_split]]
arm = "fp8"
max_tokens = 4294967295
gate_up = 1
down = 1
