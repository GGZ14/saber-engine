# Flash-Next's attention launch rules for gfx1201 (workstream FN10), as DATA: the split-KV decode
# law at GQA 12 / ONE kv head per rank (`flashnext_attn`, FN6's saber bodies over bf16 pages) and
# the grouped MTP-expert GEMM's split rule (`flashnext_moe`). Read by `saber_kernels::fn6`
# (`decode_route`, `decode_splits`, `mtp_expert_splits`); no engine binds them yet (F2). Keyed to
# the `flashnext_attn` / `flashnext_moe` plugins only, so an edit re-keys no 27B route.
schema_version = 1
name = "flashnext-attn-gfx1201"

# THE SPLIT LAW (the reference's `decode_splits`, saber_gfx1201.toml [decode_splits], the same four
# constants): a fill target over (kv_heads x sequences) work units, snapped DOWN to a power of two
# in floor..=ceiling, then halved until a segment holds >= min_tiles_per_segment 16-key tiles.
# kv_heads is 1 per rank at TP=2 (upstream shards the 2 kv heads). The fill target is per ROW below.
[decode_splits]
kv_heads = 1
ceiling = 128
floor = 16
min_tiles_per_segment = 2
tile = 16

# THE ROUTE TABLE: one row per (query rows per sequence 1..5 = the verify-width law, captured
# decode batch 1/2/4/8 = the B1 bucket a step of N sequences replays, context band <= 2,048 /
# <= 8,192 / above). The first row with rows == q_len, batch >= sequences, max_ctx >= the plan's
# context wins. `fill_target` feeds the split law above; `form` = "declc" (decode + last-arriving
# merge, ONE launch) or "pair" (decode + `fn_attn_splitkv_combine_h256_pf1`, TWO) -- byte-identical
# at the same split count (FN6: 86/86), so the form is a pure time choice per cell. A fill target
# that changes a cell's split count changes its segmentation and so its BYTES (a numerics change,
# never a table edit alone). The context band above 8,192 was measured at 32,768.
#
# MEASURED (FN10 holds 1 + 2, card 1, 210 W, 2026-09-28, IC-cold 256 MiB scrub, 4 / 6 rounds x 7
# reps alternating order, every sequence at the band's edge, us declc -> pair at the law's split
# count; LEDGER FN10): the pair beats the declc by more than the cell's round-to-round spread in
# BOTH holds in 57 of 60 cells -- b1 w5 2k 172.6 -> 27.5, 8k 308.6 -> 51.2, 32k 359.1 -> 109.0;
# b8 w5 32k 572.3 -> 523.3 (0.74 -> 0.81 of the KV-byte roof). The declc's last-arriving workgroup
# merges splits x rows partials alone, latency-bound (the 27B measured the same: H38 row 6,
# +2.9 ms/step, never served). The three cells inside their floor in one hold (2,048 / b8 / w2;
# 8,192 and 32,768 / b8 / w1: gains 1-15 %, never a loss) keep the declc row (one launch fewer).

[[decode_route]]
rows = 1
batch = 1
max_ctx = 2048
fill_target = 192
form = "pair"

[[decode_route]]
